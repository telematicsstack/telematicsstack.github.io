name: Release decks

on:
  push:
    tags:
      - "decks-v*"
  pull_request:
    paths:
      - "decks/**"
      - "design-system/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build deck-builder image
        run: docker build -f decks/Dockerfile -t decks-builder .

      - name: Build decks
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            DECK_VERSION="${GITHUB_REF_NAME#decks-}"
          else
            DECK_VERSION="pr-${GITHUB_SHA::7}"
          fi
          docker run --rm -v "$PWD:/work" -w /work/decks -e DECK_VERSION="$DECK_VERSION" decks-builder \
            bash -c 'uv sync --frozen && uv run prepare.py && for f in content/*.yaml; do uv run build.py "$f"; done'

      - name: Upload dist as workflow artifact (for PR review)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: decks
          path: decks/dist/

      - name: Attach decks to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Upload decks to release $GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber decks/dist/*.pptx decks/dist/*.pdf
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
              decks/dist/*.pptx decks/dist/*.pdf
          fi
